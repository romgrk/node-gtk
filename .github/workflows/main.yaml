name: main
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build-windows:
    name: windows - nodejs ${{ matrix.node }}
    # Pinned to windows-2022: windows-latest now ships Visual Studio 18 (2026),
    # which node-gyp can't identify (reports version "undefined") and fails its
    # win32 VS-detection gate during configure — even though the real compile
    # uses MINGW gcc. windows-2022 has VS 2022 (v17), which node-gyp recognizes.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node:
          - 26
          - 24
          - 22
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: |
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-gobject-introspection
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-libsoup3
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-gtksourceview5
            mingw-w64-x86_64-graphene
            mingw-w64-x86_64-adwaita-icon-theme

      - name: Install & Build
        env:
          GYP_GENERATORS: make
          CC: gcc
          CXX: g++
        run: |
          ./windows/mingw_include_extra.sh
          export MINGW_WINDOWS_PATH=$(./windows/mingw_windows_path.sh)
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          npm install -g pnpm@11
          pnpm install --ignore-scripts
          pnpm run build:full

      - name: Run tests
        run: |
          NODE_GTK_TEST_SKIP=callback npx mocha tests/__run__.js

      # Make the freshly-built addon a self-contained prebuilt: bundle the GTK4
      # runtime (DLLs + GI typelibs + data) next to the .node so Windows users
      # can `npm install node-gtk` with no MSYS2/compiler. lib/native.js wires
      # this bundle up automatically at load time.
      - name: Bundle GTK4 runtime
        run: |
          ABI=$(node -p "process.versions.modules")
          ./scripts/windows-bundle-runtime.sh "lib/binding/node-v${ABI}-win32-x64"

      # Publish the prebuilt to S3 on a `[publish binary]` commit, like the
      # Linux/macOS jobs do via scripts/ci.sh.
      - name: Publish prebuilt
        if: contains(github.event.head_commit.message, '[publish binary]')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          npx node-pre-gyp package
          npx node-pre-gyp publish
          npx node-pre-gyp info

  build:
    name: ${{ matrix.os }} - nodejs ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 26
          - 24
          - 22
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      # FIXME: cache disabled becasue not working for now
      # Setup cache
      # - uses: actions/cache@v2
      #   id: node-gtk-cache
      #   with:
      #     path: ${{ runner.temp }}/packages-cache
      #     key: ${{ runner.os }}-node-${{ matrix.node }}-cache-key-1.0

      # Install & cache packages
      # - uses: airvzxf/cache-anything-new-action@v1.0.1
      #   with:
      #     script: 'install.sh'
      #     is_cached: ${{ steps.cache-id.outputs.cache-hit }}
      #     cache: ${{ runner.temp }}/packages-cache
      #     snapshot: '/'
      #     exclude: '/boot /data /dev /mnt /proc /run /sys'

      # Install & cache packages
      - run: .github/workflows/install.sh

      # Install & Build. The source build is explicit (the install lifecycle
      # script is skipped): pnpm does not forward --build-from-source or
      # inherited npm_config_* env vars to lifecycle scripts, so a plain
      # `pnpm install` would silently fetch a stale S3 prebuilt instead.
      - run: npm install -g pnpm@11
      - run: pnpm install --ignore-scripts
      - run: pnpm run build:full

      # Run the CI script (tests & publishing)
      - run: ./scripts/ci.sh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # `node-gtk bundle` end-to-end: bundle a smoke app against this checkout,
      # then run the produced launcher. Linux-only for now; one node version
      # suffices (the bundler is ABI-generic JS, tested against the matrix's
      # addon build anyway).
      - name: Bundle smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: xvfb-run -a node scripts/bundle-smoke-test.js

      # `node-gtk flatpak` generation: manifest + offline sources must be
      # complete and buildable. The full sandbox build is not run per-CI-run
      # (it downloads the ~1GB GNOME SDK); this check needs no flatpak at all.
      - name: Flatpak generation smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/flatpak-smoke-test.js
